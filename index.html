        :root {

        .features { list-style: none; font-size: 0.85rem; margin-bottom: 20px; }
        .features li { margin-bottom: 6px; }

        .btn-action { display: flex; align-items: center; justify-content: center; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 0.88rem; transition: background 0.2s; cursor: pointer; border: none; }
        .btn-primary { background: #38bdf8; color: #000; }
